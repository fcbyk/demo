<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画板 - 图片标注工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            flex-wrap: wrap;
            z-index: 100;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            border-right: 1px solid #0f3460;
        }
        .toolbar-group:last-child {
            border-right: none;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: #ccc;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            position: relative;
        }
        .tool-btn:hover {
            background: #0f3460;
            color: #fff;
        }
        .tool-btn.active {
            border-color: #e94560;
            background: #0f3460;
            color: #e94560;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #555;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .color-btn:hover {
            transform: scale(1.15);
        }
        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.6);
        }

        input[type="color"] {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border: 2px solid #555;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border-radius: 50%;
            border: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: #0f3460;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        .size-label {
            color: #aaa;
            font-size: 12px;
            min-width: 28px;
            text-align: center;
        }

        .import-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .import-btn:hover {
            background: #1a4a8a;
        }
        .import-btn svg {
            width: 16px;
            height: 16px;
        }

        .export-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .export-btn:hover {
            background: #ff6b81;
        }
        .export-btn svg {
            width: 16px;
            height: 16px;
        }

        /* 画布容器 */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #1a1a2e;
            background-image:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        canvas {
            cursor: crosshair;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }
        canvas.text-mode {
            cursor: text;
        }

        /* 文本输入浮层 */
        .text-input-overlay {
            position: absolute;
            display: none;
            z-index: 50;
            pointer-events: auto;
        }
        .text-input-overlay.show {
            display: block;
        }
        .text-input-overlay input {
            border: 2px dashed #e94560;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            padding: 4px 8px;
            outline: none;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #e94560;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        /* 空状态提示 */
        .empty-hint {
            position: absolute;
            color: #555;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            line-height: 1.8;
        }
        .empty-hint svg {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            opacity: 0.3;
        }
        .empty-hint .sub {
            font-size: 13px;
            color: #444;
        }

        @media (max-width: 768px) {
            .toolbar {
                padding: 8px 10px;
                gap: 4px;
            }
            .toolbar-group {
                padding: 0 4px;
            }
            .tool-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .tool-btn svg {
                width: 18px;
                height: 18px;
            }
            input[type="range"] {
                width: 50px;
            }
            .import-btn, .export-btn {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
        <!-- 画笔工具 -->
        <div class="toolbar-group">
            <button class="tool-btn active" data-tool="pen" title="画笔 (P)">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="highlighter" title="荧光笔 (H)">
                <svg viewBox="0 0 24 24">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    <line x1="2" y1="22" x2="22" y2="22"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">
                <svg viewBox="0 0 24 24">
                    <path d="M20 20H7L3 16l9-9 9 9-1 4z"/>
                    <line x1="6" y1="20" x2="10" y2="20"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="rect" title="矩形 (R)">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="1"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="arrow" title="箭头 (A)">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="19" x2="19" y2="5"/>
                    <polyline points="12 5 19 5 19 12"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="text" title="文字标注 (T)">
                <svg viewBox="0 0 24 24">
                    <polyline points="4 7 4 4 20 4 20 7"/>
                    <line x1="9" y1="20" x2="15" y2="20"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
            </button>
        </div>

        <!-- 颜色选择 -->
        <div class="toolbar-group" id="colorGroup">
            <button class="color-btn active" data-color="#e94560" style="background:#e94560;" title="红色"></button>
            <button class="color-btn" data-color="#ff6b35" style="background:#ff6b35;" title="橙色"></button>
            <button class="color-btn" data-color="#f7c948" style="background:#f7c948;" title="黄色"></button>
            <button class="color-btn" data-color="#4ecdc4" style="background:#4ecdc4;" title="青色"></button>
            <button class="color-btn" data-color="#2e86de" style="background:#2e86de;" title="蓝色"></button>
            <button class="color-btn" data-color="#a29bfe" style="background:#a29bfe;" title="紫色"></button>
            <button class="color-btn" data-color="#ffffff" style="background:#ffffff;" title="白色"></button>
            <button class="color-btn" data-color="#000000" style="background:#000000;" title="黑色"></button>
            <input type="color" id="customColor" value="#e94560" title="自定义颜色">
        </div>

        <!-- 画笔大小 -->
        <div class="toolbar-group">
            <span class="size-label" id="sizeLabel">4px</span>
            <input type="range" id="brushSize" min="1" max="40" value="4" title="画笔大小">
        </div>

        <!-- 操作按钮 -->
        <div class="toolbar-group">
            <button class="tool-btn" id="undoBtn" title="撤销 (Ctrl+Z)">
                <svg viewBox="0 0 24 24">
                    <polyline points="1 4 1 10 7 10"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
            </button>
            <button class="tool-btn" id="redoBtn" title="重做 (Ctrl+Shift+Z)">
                <svg viewBox="0 0 24 24">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
            <button class="tool-btn" id="clearBtn" title="清除画布">
                <svg viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
            </button>
        </div>

        <!-- 导入/导出 -->
        <div class="toolbar-group">
            <label class="import-btn" title="导入图片">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                导入图片
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
            </label>
            <button class="export-btn" id="exportBtn" title="导出图片">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                导出图片
            </button>
        </div>
    </div>

    <!-- 画布容器 -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="drawCanvas"></canvas>
        <div class="text-input-overlay" id="textOverlay">
            <input type="text" id="textInput" placeholder="输入文字后按回车" maxlength="50">
        </div>
        <div class="empty-hint" id="emptyHint">
            <div>
                <svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="8" y="8" width="44" height="44" rx="5"/>
                    <circle cx="21" cy="21" r="4"/>
                    <polyline points="52 38 38 22 16 52"/>
                </svg>
            </div>
            <div>点击「导入图片」开始编辑</div>
            <div class="sub">或直接在画布上涂鸦</div>
        </div>
    </div>

    <!-- 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const canvas = document.getElementById('drawCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvasContainer');
            const emptyHint = document.getElementById('emptyHint');
            const textOverlay = document.getElementById('textOverlay');
            const textInput = document.getElementById('textInput');
            const toast = document.getElementById('toast');

            // 状态
            let currentTool = 'pen';
            let currentColor = '#e94560';
            let brushSize = 4;
            let isDrawing = false;
            let hasImage = false;
            let imageLoaded = false;

            // 形状绘制状态（矩形/箭头）
            let shapeStartX = 0;
            let shapeStartY = 0;
            let shapeEndX = 0;
            let shapeEndY = 0;
            let isDrawingShape = false;
            let snapshotBeforeShape = null; // 开始绘制形状前的画布快照，用于实时预览

            // 历史记录（撤销/重做）
            const MAX_HISTORY = 50;
            let history = [];
            let historyIndex = -1;

            // 背景图片
            let bgImage = null;
            let bgImageData = null; // 导入时的原始图片数据

            // 画布尺寸
            const DEFAULT_WIDTH = 800;
            const DEFAULT_HEIGHT = 600;
            let canvasWidth = DEFAULT_WIDTH;
            let canvasHeight = DEFAULT_HEIGHT;

            // 文本输入位置
            let textX = 0;
            let textY = 0;

            // 初始化画布
            function initCanvas() {
                resizeCanvas();
                clearCanvas();
                saveHistory();
                updateUndoRedoButtons();
            }

            function resizeCanvas() {
                const maxW = container.clientWidth - 40;
                const maxH = container.clientHeight - 40;
                const ratio = canvasWidth / canvasHeight;
                let w, h;
                if (maxW / maxH > ratio) {
                    h = Math.min(maxH, canvasHeight);
                    w = h * ratio;
                } else {
                    w = Math.min(maxW, canvasWidth);
                    h = w / ratio;
                }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
            }

            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (bgImage) {
                    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
                }
                updateEmptyHint();
            }

            function updateEmptyHint() {
                if (bgImage || historyIndex > 0) {
                    emptyHint.style.display = 'none';
                } else {
                    emptyHint.style.display = 'block';
                }
            }

            // 历史记录
            function saveHistory() {
                const data = canvas.toDataURL();
                // 移除后续历史
                history = history.slice(0, historyIndex + 1);
                history.push(data);
                if (history.length > MAX_HISTORY) {
                    history.shift();
                } else {
                    historyIndex++;
                }
                updateUndoRedoButtons();
                updateEmptyHint();
            }

            function undo() {
                if (historyIndex <= 0) return;
                historyIndex--;
                restoreFromHistory();
            }

            function redo() {
                if (historyIndex >= history.length - 1) return;
                historyIndex++;
                restoreFromHistory();
            }

            function restoreFromHistory() {
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    updateUndoRedoButtons();
                    updateEmptyHint();
                };
                img.src = history[historyIndex];
            }

            function updateUndoRedoButtons() {
                document.getElementById('undoBtn').style.opacity = historyIndex > 0 ? '1' : '0.4';
                document.getElementById('redoBtn').style.opacity = historyIndex < history.length - 1 ? '1' : '0.4';
            }

            // 坐标转换
            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            function getTouchPos(e) {
                const touch = e.touches[0] || e.changedTouches[0];
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (touch.clientX - rect.left) * scaleX,
                    y: (touch.clientY - rect.top) * scaleY
                };
            }

            // 设置画笔样式
            function setBrushStyle() {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = brushSize;

                if (currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                } else if (currentTool === 'highlighter') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = hexToRgba(currentColor, 0.4);
                    ctx.lineWidth = brushSize * 2.5;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = currentColor;
                }
            }

            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r},${g},${b},${alpha})`;
            }

            // 绘制矩形预览
            function drawRectPreview() {
                const x = Math.min(shapeStartX, shapeEndX);
                const y = Math.min(shapeStartY, shapeEndY);
                const w = Math.abs(shapeEndX - shapeStartX);
                const h = Math.abs(shapeEndY - shapeStartY);

                if (w < 2 && h < 2) return;

                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'square';
                ctx.lineJoin = 'miter';
                ctx.setLineDash([]);
                ctx.strokeRect(x, y, w, h);
            }

            // 绘制箭头预览
            function drawArrowPreview() {
                const dx = shapeEndX - shapeStartX;
                const dy = shapeEndY - shapeStartY;
                const length = Math.sqrt(dx * dx + dy * dy);

                if (length < 5) return;

                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.fillStyle = currentColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.setLineDash([]);

                // 箭头头部参数
                const arrowHeadLength = Math.min(20, length * 0.35);
                const arrowHeadAngle = Math.PI / 6; // 30度
                const angle = Math.atan2(dy, dx);

                // 箭头尾部位置（从终点往起点方向偏移箭头头部长度）
                const arrowBaseX = shapeEndX - arrowHeadLength * Math.cos(angle);
                const arrowBaseY = shapeEndY - arrowHeadLength * Math.sin(angle);

                // 绘制箭杆
                ctx.beginPath();
                ctx.moveTo(shapeStartX, shapeStartY);
                ctx.lineTo(arrowBaseX, arrowBaseY);
                ctx.stroke();

                // 绘制箭头头部（实心三角形）
                ctx.beginPath();
                ctx.moveTo(shapeEndX, shapeEndY);
                ctx.lineTo(
                    arrowBaseX - arrowHeadLength * Math.cos(angle - arrowHeadAngle),
                    arrowBaseY - arrowHeadLength * Math.sin(angle - arrowHeadAngle)
                );
                ctx.lineTo(
                    arrowBaseX - arrowHeadLength * Math.cos(angle + arrowHeadAngle),
                    arrowBaseY - arrowHeadLength * Math.sin(angle + arrowHeadAngle)
                );
                ctx.closePath();
                ctx.fill();
            }

            // 绘制
            function startDraw(e) {
                if (currentTool === 'text') return;
                const pos = e.touches ? getTouchPos(e) : getCanvasPos(e);

                if (currentTool === 'rect' || currentTool === 'arrow') {
                    // 形状工具：记录起始点，保存快照
                    isDrawingShape = true;
                    shapeStartX = pos.x;
                    shapeStartY = pos.y;
                    shapeEndX = pos.x;
                    shapeEndY = pos.y;
                    snapshotBeforeShape = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    return;
                }

                isDrawing = true;
                setBrushStyle();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                // 画一个点
                ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
                ctx.stroke();
            }

            function draw(e) {
                if (!isDrawing && !isDrawingShape) return;
                e.preventDefault();
                const pos = e.touches ? getTouchPos(e) : getCanvasPos(e);

                if (isDrawingShape) {
                    // 形状实时预览
                    shapeEndX = pos.x;
                    shapeEndY = pos.y;
                    if (snapshotBeforeShape) {
                        ctx.putImageData(snapshotBeforeShape, 0, 0);
                    }
                    if (currentTool === 'rect') {
                        drawRectPreview();
                    } else if (currentTool === 'arrow') {
                        drawArrowPreview();
                    }
                    return;
                }

                setBrushStyle();
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }

            function endDraw(e) {
                if (!isDrawing && !isDrawingShape) return;

                if (isDrawingShape) {
                    isDrawingShape = false;
                    snapshotBeforeShape = null;

                    // 恢复快照并绘制最终形状
                    if (currentTool === 'rect') {
                        drawRectPreview();
                    } else if (currentTool === 'arrow') {
                        drawArrowPreview();
                    }
                    saveHistory();
                    return;
                }

                isDrawing = false;
                ctx.globalCompositeOperation = 'source-over';
                ctx.closePath();
                saveHistory();
            }

            // 文字工具
            function activateTextTool(e) {
                if (currentTool !== 'text') return;
                e.preventDefault();
                e.stopPropagation();
                const pos = e.touches ? getTouchPos(e) : getCanvasPos(e);
                textX = pos.x;
                textY = pos.y;

                // 定位输入框（相对于 canvasContainer）
                const canvasRect = canvas.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const scaleX = canvasRect.width / canvas.width;
                const scaleY = canvasRect.height / canvas.height;
                const left = (canvasRect.left - containerRect.left) + pos.x * scaleX;
                const top = (canvasRect.top - containerRect.top) + pos.y * scaleY;
                textOverlay.style.left = left + 'px';
                textOverlay.style.top = top + 'px';
                textOverlay.style.transform = 'translate(-50%, -50%)';
                textOverlay.classList.add('show');
                textInput.style.color = currentColor;
                textInput.style.fontSize = Math.max(16, brushSize * 4) + 'px';
                textInput.value = '';
                // 延迟聚焦，确保 DOM 更新后再聚焦
                requestAnimationFrame(() => {
                    textInput.focus();
                });
            }

            function commitText() {
                const text = textInput.value.trim();
                textOverlay.classList.remove('show');
                if (!text) return;

                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = currentColor;
                const fontSize = Math.max(16, brushSize * 4);
                ctx.font = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';

                // 添加描边让文字更醒目
                ctx.strokeStyle = (currentColor === '#ffffff' || currentColor === '#f7c948') ? '#000000' : '#ffffff';
                ctx.lineWidth = Math.max(2, fontSize / 10);
                ctx.lineJoin = 'round';
                ctx.strokeText(text, textX, textY);
                ctx.fillText(text, textX, textY);

                saveHistory();
                showToast('文字已添加');
            }

            textInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    commitText();
                }
                if (e.key === 'Escape') {
                    textOverlay.classList.remove('show');
                }
            });
            textInput.addEventListener('blur', function() {
                setTimeout(() => {
                    if (textOverlay.classList.contains('show') && textInput.value.trim()) {
                        commitText();
                    }
                }, 200);
            });

            // 点击输入框本身时阻止事件冒泡，避免触发 canvas 的 mousedown
            textOverlay.addEventListener('mousedown', function(e) {
                e.stopPropagation();
            });
            textInput.addEventListener('mousedown', function(e) {
                e.stopPropagation();
            });

            // 事件绑定
            canvas.addEventListener('mousedown', function(e) {
                if (currentTool === 'text') {
                    // 如果已有输入框在显示，先提交
                    if (textOverlay.classList.contains('show') && textInput.value.trim()) {
                        commitText();
                    }
                    textOverlay.classList.remove('show');
                    activateTextTool(e);
                } else if (currentTool === 'rect' || currentTool === 'arrow') {
                    // 形状工具
                    if (textOverlay.classList.contains('show') && textInput.value.trim()) {
                        commitText();
                    }
                    textOverlay.classList.remove('show');
                    startDraw(e);
                } else {
                    // 切换到绘制工具时，如果输入框还在显示就提交
                    if (textOverlay.classList.contains('show') && textInput.value.trim()) {
                        commitText();
                    }
                    textOverlay.classList.remove('show');
                    startDraw(e);
                }
            });
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (currentTool === 'text') {
                    activateTextTool(e);
                } else {
                    startDraw(e);
                }
            }, { passive: false });
            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                draw(e);
            }, { passive: false });
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchcancel', endDraw);

            // 工具切换
            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentTool = this.dataset.tool;
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove(
                        'active'));
                    this.classList.add('active');
                    textOverlay.classList.remove('show');

                    if (currentTool === 'text') {
                        canvas.classList.add('text-mode');
                    } else {
                        canvas.classList.remove('text-mode');
                    }
                });
            });

            // 颜色选择
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentColor = this.dataset.color;
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove(
                        'active'));
                    this.classList.add('active');
                    document.getElementById('customColor').value = currentColor;
                });
            });

            document.getElementById('customColor').addEventListener('input', function() {
                currentColor = this.value;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            });

            // 画笔大小
            const brushSizeInput = document.getElementById('brushSize');
            const sizeLabel = document.getElementById('sizeLabel');
            brushSizeInput.addEventListener('input', function() {
                brushSize = parseInt(this.value);
                sizeLabel.textContent = brushSize + 'px';
            });

            // 撤销/重做
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);

            // 清除
            document.getElementById('clearBtn').addEventListener('click', function() {
                if (confirm('确定要清除画布上的所有内容吗？')) {
                    bgImage = null;
                    bgImageData = null;
                    imageLoaded = false;
                    hasImage = false;
                    clearCanvas();
                    saveHistory();
                    showToast('画布已清除');
                }
            });

            // 导入图片
            document.getElementById('imageInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        bgImage = img;
                        bgImageData = ev.target.result;
                        imageLoaded = true;
                        hasImage = true;
                        // 调整画布尺寸以匹配图片
                        canvasWidth = img.width;
                        canvasHeight = img.height;
                        resizeCanvas();
                        clearCanvas();
                        saveHistory();
                        showToast('图片已导入 (' + img.width + '×' + img.height + ')');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            // 导出图片
            document.getElementById('exportBtn').addEventListener('click', function() {
                // 创建一个临时画布来合成最终结果
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height;
                const exportCtx = exportCanvas.getContext('2d');

                // 绘制白色背景
                exportCtx.fillStyle = '#ffffff';
                exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

                // 绘制当前画布内容
                exportCtx.drawImage(canvas, 0, 0);

                // 导出
                const link = document.createElement('a');
                link.download = '画板导出_' + new Date().toISOString().slice(0, 10) + '.png';
                link.href = exportCanvas.toDataURL('image/png');
                link.click();
                showToast('图片已导出');
            });

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                // Ctrl+S / Cmd+S 导出
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    document.getElementById('exportBtn').click();
                    return;
                }
                // Ctrl+Z 撤销
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                    return;
                }
                // Ctrl+Shift+Z 重做
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Z') {
                    e.preventDefault();
                    redo();
                    return;
                }
                // 工具快捷键
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                switch (e.key.toLowerCase()) {
                    case 'p':
                        switchTool('pen');
                        break;
                    case 'h':
                        switchTool('highlighter');
                        break;
                    case 'e':
                        switchTool('eraser');
                        break;
                    case 'r':
                        switchTool('rect');
                        break;
                    case 'a':
                        switchTool('arrow');
                        break;
                    case 't':
                        switchTool('text');
                        break;
                }
            });

            function switchTool(tool) {
                currentTool = tool;
                document.querySelectorAll('[data-tool]').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.tool === tool) b.classList.add('active');
                });
                textOverlay.classList.remove('show');
                if (tool === 'text') {
                    canvas.classList.add('text-mode');
                } else {
                    canvas.classList.remove('text-mode');
                }
                // 切换工具时取消正在进行的形状绘制
                if (isDrawingShape) {
                    isDrawingShape = false;
                    snapshotBeforeShape = null;
                }
            }

            // Toast
            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1500);
            }

            // 窗口大小变化
            window.addEventListener('resize', resizeCanvas);

            // 粘贴图片
            document.addEventListener('paste', function(e) {
                const items = e.clipboardData.items;
                for (let item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const blob = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const img = new Image();
                            img.onload = function() {
                                bgImage = img;
                                bgImageData = ev.target.result;
                                imageLoaded = true;
                                hasImage = true;
                                canvasWidth = img.width;
                                canvasHeight = img.height;
                                resizeCanvas();
                                clearCanvas();
                                saveHistory();
                                showToast('图片已粘贴 (' + img.width + '×' + img.height +
                                    ')');
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(blob);
                        break;
                    }
                }
            });

            // 拖拽导入图片
            container.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
            });
            container.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const file = e.dataTransfer.files[0];
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        bgImage = img;
                        bgImageData = ev.target.result;
                        imageLoaded = true;
                        hasImage = true;
                        canvasWidth = img.width;
                        canvasHeight = img.height;
                        resizeCanvas();
                        clearCanvas();
                        saveHistory();
                        showToast('图片已导入 (' + img.width + '×' + img.height + ')');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 启动
            initCanvas();
            showToast('画板就绪 | P画笔 H荧光笔 E橡皮 R矩形 A箭头 T文字 Ctrl+Z撤销 Ctrl+S导出');
        })();
    </script>
</body>
</html>
